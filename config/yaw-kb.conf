# yaw-kb configuration
# Uncomment options below as needed

# Increase Bluetooth TX power for better range
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Sleep timeout in ms (default 900000 = 15 min)
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Idle timeout in ms (default 30000 = 30 sec)
# CONFIG_ZMK_IDLE_TIMEOUT=30000

# Increase the number of Bluetooth profiles (default 5)
# CONFIG_BT_MAX_CONN=5

# Debounce press/release in ms (default 5)
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
